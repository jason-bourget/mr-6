      <path d="M-24,-36 L-28,-44 L-20,-40 Z" fill="#070914"/>
      <circle cx="-19" cy="-28" r="2" fill="#ffb74a"/>
    </g>
  </defs>
  <rect width="800" height="500" fill="url(#night)"/>
  <g fill="#dfe6ff" opacity="0.8"><circle cx="120" cy="60" r="2"/><circle cx="300" cy="40" r="1.6"/><circle cx="500" cy="80" r="2"/><circle cx="660" cy="50" r="1.8"/><circle cx="730" cy="130" r="1.4"/></g>
