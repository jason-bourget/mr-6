    <path d="M9,-44 L36,-66" stroke="#0f1330" stroke-width="6" stroke-linecap="round"/>
    <rect x="34" y="-72" width="7" height="30" rx="3" fill="#3d2c16" transform="rotate(18 37 -57)"/>
    <path d="M46,-78 C34,-98 44,-114 49,-122 C54,-112 64,-96 46,-78 Z" fill="#ff9e4a"/>
    <path d="M47,-84 C41,-96 46,-106 49,-110 C52,-105 56,-96 47,-84 Z" fill="#ffe98a"/>
