  <g transform="translate(650,390) scale(1.2)"><use href="#wolf"/></g>
  <g transform="translate(720,430) scale(1.35)"><use href="#wolf"/></g>
  <g transform="translate(600,470) scale(1.6)"><use href="#wolf"/></g>
  <g transform="translate(470,340) scale(1.0)" opacity="0.85"><use href="#wolf"/></g>
  <g transform="translate(540,310) scale(0.85)" opacity="0.7"><use href="#wolf"/></g>
  <g transform="translate(620,330) scale(0.9)" opacity="0.7"><use href="#wolf"/></g>
  <g transform="translate(700,310) scale(0.8)" opacity="0.6"><use href="#wolf"/></g>
