<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d1c"/><stop offset="0.7" stop-color="#161c38"/><stop offset="1" stop-color="#232c52"/>
    </linearGradient>
    <radialGradient id="torch" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf6e" stop-opacity="0.85"/><stop offset="0.5" stop-color="#ff9e4a" stop-opacity="0.3"/><stop offset="1" stop-color="#ff9e4a" stop-opacity="0"/>
    </radialGradient>
    <g id="wolf">
