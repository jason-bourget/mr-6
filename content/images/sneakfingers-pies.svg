  <g fill="#c04a68"><circle cx="565" cy="248" r="2.4"/><circle cx="545" cy="300" r="2.2"/><circle cx="520" cy="340" r="2.4"/><circle cx="490" cy="390" r="2.2"/></g>
  <!-- street -->
  <path d="M0,438 L800,438 L800,500 L0,500 Z" fill="#0a0d20"/>
  <!-- Mr 6 pointing up at the thief -->
  <g transform="translate(360,434)">
    <path d="M-8,-38 Q-30,-20 -26,8 L-6,2 Z" fill="#232a58"/>
    <rect x="-8" y="-6" width="6" height="16" rx="3" fill="#0a0d20"/>
    <rect x="2" y="-6" width="6" height="16" rx="3" fill="#0a0d20"/>
    <path d="M-10,-40 Q0,-46 10,-40 L8,-4 L-8,-4 Z" fill="#101534"/>
    <circle cx="0" cy="-48" r="9" fill="#101534"/>
    <path d="M0,-57 Q10,-70 4,-78" stroke="#e05a7a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M8,-38 L34,-60" stroke="#101534" stroke-width="5" stroke-linecap="round"/>
    <path d="M-22,-34 q-10,4 -10,14 q0,12 10,16 q10,-4 10,-16 q0,-10 -10,-14 Z" fill="#161c40" stroke="#5f6cb4" stroke-width="2"/>
    <text x="-22" y="-11" text-anchor="middle" font-size="15" font-family="Georgia, serif" font-weight="bold" fill="#ffd76b">6</text>
