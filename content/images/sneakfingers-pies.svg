    <rect x="470" y="360" width="28" height="36" rx="4"/>
    <rect x="660" y="380" width="22" height="28" rx="4"/>
  </g>
  <!-- bakery window with pies -->
  <g>
    <rect x="255" y="352" width="90" height="52" rx="6" fill="#ffbe5c" opacity="0.95"/>
    <path d="M266,392 a12,9 0 0 1 24,0 Z" fill="#8a4b2a"/>
    <path d="M296,392 a12,9 0 0 1 24,0 Z" fill="#8a4b2a"/>
    <path d="M281,376 a12,9 0 0 1 24,0 Z" fill="#8a4b2a"/>
  </g>
  <!-- Sneakfingers running on a rooftop with a pie -->
  <g fill="#070919">
    <path d="M478,250 C470,236 476,222 490,220 C486,208 498,198 510,204 C514,192 532,190 540,200 C556,196 566,210 558,222 L566,236 C574,248 564,262 550,258 L536,270 L524,254 L508,268 L498,250 Z"/>
    <path d="M536,270 L548,292 L558,286" stroke="#070919" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M508,268 L500,290 L488,288" stroke="#070919" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M558,222 L586,214" stroke="#070919" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M580,206 a14,10 0 0 1 28,0 Z" fill="#8a4b2a"/>
  <g fill="#ffd76b"><circle cx="510" cy="222" r="2.8"/><circle cx="524" cy="220" r="2.8"/></g>
