<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131736"/><stop offset="0.7" stop-color="#2a3060"/><stop offset="1" stop-color="#3d477f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="150" cy="90" r="40" fill="#fdf6d8"/>
  <g fill="#e8ecff" opacity="0.8"><circle cx="320" cy="60" r="2"/><circle cx="470" cy="100" r="1.6"/><circle cx="620" cy="50" r="2"/><circle cx="720" cy="120" r="1.5"/></g>
  <!-- village rooftops -->
  <g fill="#0e1128">
    <path d="M0,320 L110,240 L220,320 L220,440 L0,440 Z"/>
    <path d="M200,340 L300,270 L400,340 L400,440 L200,440 Z"/>
    <path d="M380,330 L500,250 L620,330 L620,440 L380,440 Z"/>
