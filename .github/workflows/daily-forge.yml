name: Daily Story Forge

on:
  schedule:
    # 12:00 UTC daily (~6 AM Mountain Time)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic pillow

      - name: Forge 10 new adventures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generator/generate.py --count 10

      - name: Commit and push
        run: |
          git config user.name "Story Forge"
          git config user.email "actions@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Story Forge: today's new adventures"
            git push
          fi
